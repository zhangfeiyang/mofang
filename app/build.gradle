plugins {
    id 'com.android.application'
}

def ksPropsFile = rootProject.file('keystore.properties')
if (!ksPropsFile.exists()) {
    ksPropsFile = file(System.getProperty("user.home") + "/.android/cubear-keystore.properties")
}
def ksProps = new Properties()
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.mofang.cubear'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mofang.cubear'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '2.1.0'

        ndk {
            abiFilters 'arm64-v8a'
            // `-Pemulator` adds the x86_64 libraries so the app also runs on an x86 emulator.
            if (project.hasProperty('emulator')) abiFilters 'x86_64'
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (ksProps.containsKey('storeFile')) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksProps.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    def camerax_version = '1.4.2'
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'


    testImplementation 'junit:junit:4.13.2'
}
