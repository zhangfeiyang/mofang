name: iOS Screenshots

# 用 iOS 模拟器为 App Store 生成产品页截图(6.9 英寸 1320×2868)。
# App 内置演示模式(启动参数 -demo 1),用真实 UI + 真实求解状态出图:
#   -demoScreen 1 扫描中 / 2 扫描完成(待开始) / 3 引导中
# 产物上传为 artifact appstore-screenshots,由 asc_fill_listing.py 上传 ASC。

on:
  workflow_dispatch:

env:
  BUNDLE_ID: com.mofang.cubear

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          X26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X26" ] && sudo xcode-select -s "$X26"
          xcodebuild -version

      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild -project CubeAR.xcodeproj -scheme CubeAR \
            -configuration Debug -destination 'generic/platform=iOS Simulator' build \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | xcbeautify
        working-directory: ios

      - name: Pick Pro Max simulator
        run: |
          xcrun simctl list devices available | grep -E "iPhone" || true
          UUID_RE="[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}"
          UDID=$(xcrun simctl list devices available | grep "Pro Max" | head -1 | grep -oE "$UUID_RE")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "$UUID_RE")
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Screenshot 1 — scanning（扫描中）
        run: |
          mkdir -p shots
          APP=$(find ios/build/sim/Build/Products -name "CubeAR.app" -type d | head -1)
          [ -n "$APP" ] || { echo "::error::CubeAR.app not found"; exit 1; }
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -demo 1 -demoScreen 1 > shots/app1.log 2>&1 &
          sleep 10
          xcrun simctl io "$UDID" screenshot --type=png shots/01_scanning.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          tail -20 shots/app1.log || true
          xcrun simctl spawn "$UDID" log show --last 1m --predicate 'processImagePath CONTAINS "CubeAR"' --style compact 2>/dev/null | tail -30 || true

      - name: Screenshot 2 — ready（扫描完成）
        run: |
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -demo 1 -demoScreen 2 > shots/app2.log 2>&1 &
          sleep 10
          xcrun simctl io "$UDID" screenshot --type=png shots/02_ready.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          tail -20 shots/app2.log || true

      - name: Screenshot 3 — guiding（引导中）
        run: |
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -demo 1 -demoScreen 3 > shots/app3.log 2>&1 &
          sleep 10
          xcrun simctl io "$UDID" screenshot --type=png shots/03_guiding.png
          tail -20 shots/app3.log || true
          # 收集模拟器崩溃报告便于诊断
          find ~/Library/Logs/DiagnosticReports -name "CubeAR*" -mmin -10 -exec tail -40 {} \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: |
            shots/*.png
            shots/*.log

