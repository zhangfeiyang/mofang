name: iOS Screenshots

# 用 iOS 模拟器为 App Store 生成产品页截图(6.9 英寸 1320×2868),并直接上传 ASC 元数据。
# App 内置演示模式(启动参数 -demo 1),用真实 UI + 真实求解状态出图:
#   -demoScreen 1 扫描中 / 2 扫描完成(待开始) / 3 引导中
# 触发:workflow_dispatch,或 push 修改本文件(网络受限时用 git push 触发)。
# 完成后回写 .github/.screenshots-status 标记(供无 API 环境用 git 轮询)。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ios-screenshots.yml"]

permissions:
  contents: write

env:
  BUNDLE_ID: com.mofang.cubear

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          X26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X26" ] && sudo xcode-select -s "$X26"
          xcodebuild -version

      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild -project CubeAR.xcodeproj -scheme CubeAR \
            -configuration Debug -destination 'generic/platform=iOS Simulator' build \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | xcbeautify
        working-directory: ios

      - name: Pick Pro Max simulator
        run: |
          xcrun simctl list devices available | grep -E "iPhone" || true
          UUID_RE="[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}"
          UDID=$(xcrun simctl list devices available | grep "Pro Max" | head -1 | grep -oE "$UUID_RE")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "$UUID_RE")
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Screenshot 1 — scanning（扫描中）
        run: |
          mkdir -p shots
          APP=$(find ios/build/sim/Build/Products -name "CubeAR.app" -type d | head -1)
          [ -n "$APP" ] || { echo "::error::CubeAR.app not found"; exit 1; }
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -demo 1 -demoScreen 1 > shots/app1.log 2>&1 &
          sleep 10
          xcrun simctl io "$UDID" screenshot --type=png shots/01_scanning.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          tail -20 shots/app1.log || true

      - name: Screenshot 2 — ready（扫描完成）
        run: |
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -demo 1 -demoScreen 2 > shots/app2.log 2>&1 &
          sleep 10
          xcrun simctl io "$UDID" screenshot --type=png shots/02_ready.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          tail -20 shots/app2.log || true

      - name: Screenshot 3 — guiding（引导中）
        run: |
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -demo 1 -demoScreen 3 > shots/app3.log 2>&1 &
          sleep 10
          xcrun simctl io "$UDID" screenshot --type=png shots/03_guiding.png
          tail -20 shots/app3.log || true

      - name: Verify screenshots are app screens（截图必须不是主屏）
        run: |
          for f in shots/01_scanning.png shots/02_ready.png shots/03_guiding.png; do
            SIZE=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")
            echo "$f: $SIZE bytes"
            # 主屏壁纸截图远大于应用内黑底截图;>2.5MB 基本就是截到主屏了
            if [ "$SIZE" -gt 2500000 ]; then
              echo "::warning::$f 疑似截到主屏(文件过大),检查 demo 模式是否启动"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: |
            shots/*.png
            shots/*.log

      - name: Fill ASC metadata（含截图上传）
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          ASC_KEY_PATH: /tmp/authkey.p8
          SHOTS_DIR: ${{ github.workspace }}/shots
        run: |
          echo "$AC_API_KEY_P8" | base64 -d > "$ASC_KEY_PATH"
          python3 -m pip install --quiet cryptography || python3 -m pip install --quiet --break-system-packages cryptography
          set +e
          for i in 1 2 3; do
            python3 ios/tools/asc_fill_listing.py > shots/fill.log 2>&1 && { echo FILL_OK; break; }
            echo "fill attempt $i failed"; tail -5 shots/fill.log
            sleep 20
          done
          set -e
          [ -f shots/fill.log ] && cp shots/fill.log shots/fill_result.log || echo "no fill log" > shots/fill_result.log
          tail -30 shots/fill_result.log

      - name: Mark done（回写状态标记,含 fill 日志尾部）
        if: always()
        run: |
          git config user.email "ci@zhangfeiyang.dev"
          git config user.name "ci-bot"
          git fetch origin main
          git checkout -B tmp-marker origin/main
          {
            echo "screenshots run=${GITHUB_RUN_ID} time=$(date -u +%FT%TZ)"
            echo "--- fill log tail ---"
            tail -25 "$GITHUB_WORKSPACE/shots/fill_result.log" 2>/dev/null || echo "(no fill log)"
            echo "--- shot sizes ---"
            ls -la "$GITHUB_WORKSPACE/shots/"*.png 2>/dev/null || echo "(no shots)"
            echo "--- app1 launch log ---"
            cat "$GITHUB_WORKSPACE/shots/app1.log" 2>/dev/null | tail -30 || echo "(no app log)"
            echo "--- app2 launch log ---"
            cat "$GITHUB_WORKSPACE/shots/app2.log" 2>/dev/null | tail -30 || echo "(no app log)"
            echo "--- crash reports ---"
            find ~/Library/Logs/DiagnosticReports -name "CubeAR*" -mmin -30 2>/dev/null | head -3
            for f in $(find ~/Library/Logs/DiagnosticReports -name "CubeAR*" -mmin -30 2>/dev/null | head -1); do
              head -40 "$f"
            done
          } > .github/.screenshots-status
          git add .github/.screenshots-status
          git commit -m "chore: screenshots status marker [skip ci]" || echo "nothing to commit"
          git push origin tmp-marker:main || echo "marker push failed"

# retrigger
